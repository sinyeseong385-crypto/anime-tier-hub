<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애니 티어 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe3;
    --ink:#171416;
    --red:#e6394b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle, rgba(23,20,22,0.07) 1px, transparent 1.2px) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 18px;}
  .view{display:none;}
  .view.active{display:block;}

  /* TOPBAR (sub-pages) */
  #topbar{
    display:none;
    align-items:center;
    gap:12px;
    padding:14px 0;
    max-width:960px;
    margin:0 auto;
    padding-left:18px; padding-right:18px;
  }
  #topbar.show{display:flex;}
  .back-btn{
    border:2px solid var(--ink);
    background:#fff;
    font-family:'Black Han Sans',sans-serif;
    font-size:14px;
    padding:7px 14px;
    border-radius:3px;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(23,20,22,0.2);
  }
  .back-btn:hover{transform:translate(-1px,-1px);}
  .topbar-title{
    font-family:'Black Han Sans',sans-serif;
    font-size:20px;
    flex:1;
  }
  .admin-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    background:var(--ink);
    color:#3ddc97;
    padding:5px 9px;
    border-radius:3px;
    letter-spacing:0.3px;
  }

  /* HERO (home only) */
  .hero{
    position:relative;
    padding:32px 22px 26px;
    background:var(--ink);
    border:4px solid var(--ink);
    border-radius:4px;
    overflow:hidden;
    margin:26px 0 22px;
    box-shadow:8px 8px 0 rgba(23,20,22,0.18);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(244,239,227,0.35) 1.6px, transparent 1.8px);
    background-size:14px 14px;
    -webkit-mask-image: linear-gradient(115deg, black 15%, transparent 55%);
            mask-image: linear-gradient(115deg, black 15%, transparent 55%);
    pointer-events:none;
  }
  .hero h1{
    position:relative;
    font-family:'Black Han Sans', sans-serif;
    font-size:clamp(32px,6vw,50px);
    letter-spacing:1px;
    color:var(--paper);
    margin:0 0 6px;
    line-height:1;
  }
  .hero h1 span{color:var(--red);}
  .hero p{
    position:relative;
    margin:0;
    color:rgba(244,239,227,0.75);
    font-size:14px;
    font-family:'JetBrains Mono', monospace;
  }

  /* WIDGET GRID */
  .widget-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:30px;
  }
  @media (max-width:560px){ .widget-grid{grid-template-columns:1fr;} }
  .widget-card{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:4px;
    padding:20px;
    cursor:pointer;
    box-shadow:5px 5px 0 rgba(23,20,22,0.16);
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:8px;
  }
  .widget-card:hover{ transform:translate(-2px,-2px); box-shadow:7px 7px 0 rgba(23,20,22,0.2); }
  .widget-icon{font-size:30px;}
  .widget-title{font-family:'Black Han Sans',sans-serif; font-size:19px;}
  .widget-desc{font-size:12.5px; color:#67615a; line-height:1.4;}
  .widget-arrow{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--red); margin-top:auto;}

  /* CONTROLS (tier page) */
  .controls{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0;}
  .add-form{
    flex:1 1 260px; display:flex; gap:8px;
    background:#fff; border:3px solid var(--ink); border-radius:4px; padding:6px;
    box-shadow:4px 4px 0 rgba(23,20,22,0.14);
  }
  .add-form input, .add-form textarea{
    flex:1; border:none; outline:none; font-family:'Inter',sans-serif;
    font-size:14px; font-weight:600; padding:8px 10px; background:transparent; color:var(--ink);
  }
  .add-form input::placeholder, .add-form textarea::placeholder{color:#9a948a; font-weight:500;}
  .add-form button, .reset-btn, .login-btn, .logout-btn{
    border:2px solid var(--ink); background:var(--red); color:#fff;
    font-family:'Black Han Sans',sans-serif; font-size:14px; padding:9px 16px;
    border-radius:3px; cursor:pointer; white-space:nowrap;
  }
  .add-form button:hover, .reset-btn:hover, .login-btn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink);}
  .reset-btn{background:var(--ink);}
  .lock-note{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:#9a9488;
    background:#fff; border:2px dashed var(--ink); border-radius:4px; padding:10px 14px; margin:20px 0;
  }

  /* TIER BOARD */
  .tier-row{
    display:flex; border:3px solid var(--ink); border-radius:4px; margin-bottom:9px;
    background:#fff; min-height:70px; overflow:hidden;
  }
  .tier-badge{
    flex:0 0 84px; display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans',sans-serif; font-size:19px; color:var(--ink);
    border-right:3px solid var(--ink); text-align:center; padding:4px;
    background: repeating-linear-gradient(135deg, rgba(23,20,22,0.10) 0 6px, transparent 6px 12px), var(--tier-color);
  }
  .dropzone{
    flex:1; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; padding:9px;
    transition:background .1s ease;
  }
  .tier-row .dropzone.drop-hover{background:rgba(230,57,75,0.10);}
  .tier-row .dropzone:empty::after{
    content:"비어있음"; font-family:'JetBrains Mono',monospace; font-size:11px; color:#c7c1b4; align-self:center;
  }

  .bench-section{margin-top:22px;}
  .bench-title{font-family:'Black Han Sans',sans-serif; font-size:17px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .bench-title::before{content:""; width:13px; height:13px; background:var(--red); border:2px solid var(--ink); display:inline-block;}
  .bench-drop{
    border:3px dashed var(--ink); border-radius:4px; min-height:90px;
    display:flex; flex-wrap:wrap; gap:8px; padding:12px; background:rgba(255,255,255,0.5);
  }
  .bench-drop.drop-hover{background:rgba(230,57,75,0.08);}
  .bench-drop:empty::after{content:"모든 애니가 배치되었습니다 🎉"; font-family:'JetBrains Mono',monospace; font-size:12px; color:#a39d8f; align-self:center; margin:auto;}

  .card{
    position:relative; display:flex; align-items:center; gap:6px; padding:7px 10px 7px 8px;
    border:2px solid var(--ink); border-radius:3px; font-size:13px; font-weight:700; color:#fff;
    user-select:none; box-shadow:2px 2px 0 rgba(23,20,22,0.35); max-width:180px;
  }
  .card.editable{cursor:grab; touch-action:none; max-width:250px;}
  .card .emoji{font-size:15px;}
  .card .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card .del{
    border:none; background:rgba(0,0,0,0.25); color:#fff; width:16px; height:16px; border-radius:50%;
    font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .card .del:hover{background:rgba(0,0,0,0.5);}
  .card .move-select{
    border:1px solid rgba(255,255,255,0.7); background:rgba(0,0,0,0.25); color:#fff;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; border-radius:3px; padding:2px 3px;
    max-width:66px; cursor:pointer; flex:0 0 auto;
  }
  .card .move-select option{color:#171416;}
  .card.dragging-source{opacity:0.3;}
  .ghost{position:fixed; top:0; left:0; z-index:999; pointer-events:none; opacity:0.95; transform:rotate(-3deg);}

  /* CRITERIA TABLE */
  .criteria-table{width:100%; border-collapse:collapse; margin:20px 0; background:#fff; border:3px solid var(--ink); border-radius:4px; overflow:hidden;}
  .criteria-table th{
    font-family:'Black Han Sans',sans-serif; font-size:13px; text-align:left; padding:10px 12px;
    background:var(--ink); color:var(--paper);
  }
  .criteria-table td{padding:11px 12px; border-top:2px solid var(--ink); font-size:13.5px; vertical-align:middle;}
  .criteria-table tr:nth-child(even) td{background:rgba(23,20,22,0.03);}
  .tier-chip{
    display:inline-flex; align-items:center; justify-content:center; min-width:58px; padding:4px 8px;
    font-family:'Black Han Sans',sans-serif; font-size:13px; border:2px solid var(--ink); border-radius:3px;
    color:var(--ink);
  }

  /* SCENES */
  .scene-card{
    background:#fff; border:3px solid var(--ink); border-radius:4px; padding:14px; margin-bottom:12px;
    box-shadow:4px 4px 0 rgba(23,20,22,0.14);
  }
  .scene-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .scene-title{font-family:'Black Han Sans',sans-serif; font-size:17px;}
  .scene-desc{font-size:13.5px; line-height:1.5; margin:8px 0; color:#3a3630;}
  .scene-embed{position:relative; width:100%; padding-top:56.25%; margin-top:8px; border:2px solid var(--ink); border-radius:3px; overflow:hidden;}
  .scene-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .scene-del{
    border:2px solid var(--ink); background:var(--red); color:#fff; font-size:11px; padding:5px 9px;
    border-radius:3px; cursor:pointer; font-family:'JetBrains Mono',monospace; white-space:nowrap;
  }
  .add-scene-form{
    background:#fff; border:3px solid var(--ink); border-radius:4px; padding:14px; margin:18px 0;
    display:flex; flex-direction:column; gap:8px; box-shadow:4px 4px 0 rgba(23,20,22,0.14);
  }
  .add-scene-form input, .add-scene-form textarea{
    border:2px solid var(--ink); border-radius:3px; padding:8px 10px; font-family:'Inter',sans-serif; font-size:13.5px; outline:none;
  }
  .add-scene-form textarea{resize:vertical; min-height:60px;}

  /* ADMIN */
  .admin-panel{
    background:#fff; border:3px solid var(--ink); border-radius:4px; padding:24px; margin:20px 0;
    box-shadow:5px 5px 0 rgba(23,20,22,0.16); max-width:400px;
  }
  .admin-panel input{
    width:100%; border:2px solid var(--ink); border-radius:3px; padding:10px 12px; font-size:15px;
    font-family:'JetBrains Mono',monospace; margin:10px 0; outline:none; letter-spacing:2px;
  }
  .admin-status{
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:10px; border-radius:3px; margin-top:10px;
  }
  .admin-status.ok{background:#e8f7f0; color:#1f7a55; border:2px solid #1f7a55;}
  .admin-status.err{background:#fdeaec; color:var(--red); border:2px solid var(--red);}

  footer.note{max-width:960px;margin:20px auto 0;padding:0 18px; font-family:'JetBrains Mono',monospace; font-size:11px; color:#9a9488;}

  .card:not(.editable){cursor:pointer;}

  /* DESC MODAL */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(23,20,22,0.55);
    align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff; border:3px solid var(--ink); border-radius:5px; max-width:420px; width:100%;
    box-shadow:8px 8px 0 rgba(23,20,22,0.25); padding:20px;
  }
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .modal-title{font-family:'Black Han Sans',sans-serif; font-size:20px; line-height:1.2;}
  .modal-close{
    border:2px solid var(--ink); background:var(--paper); width:28px; height:28px; border-radius:3px;
    font-size:15px; cursor:pointer; flex:0 0 auto;
  }
  .modal-body{font-size:14px; line-height:1.6; color:#3a3630; white-space:pre-wrap;}
  .modal-body.empty{color:#a39d8f; font-family:'JetBrains Mono',monospace; font-size:12.5px;}

  /* ADMIN DESC MANAGER */
  .desc-manager{margin-top:22px; padding-top:18px; border-top:2px dashed var(--ink);}
  .desc-manager h3{font-family:'Black Han Sans',sans-serif; font-size:16px; margin:0 0 10px;}
  .desc-manager select{
    width:100%; border:2px solid var(--ink); border-radius:3px; padding:9px 10px; font-size:13.5px;
    font-family:'Inter',sans-serif; margin-bottom:8px; background:#fff;
  }
  .desc-manager textarea{
    width:100%; border:2px solid var(--ink); border-radius:3px; padding:9px 10px; font-size:13.5px;
    font-family:'Inter',sans-serif; min-height:90px; resize:vertical; outline:none; margin-bottom:8px;
  }
  .desc-save-msg{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#1f7a55; min-height:16px;}
</style>
</head>
<body>

<div id="topbar">
  <button class="back-btn" id="backBtn">← 홈</button>
  <div class="topbar-title" id="topbarTitle"></div>
  <span class="admin-badge" id="adminBadge" style="display:none;">🔓 관리자 모드</span>
</div>

<!-- HOME -->
<div class="view active" id="view-home">
  <div class="wrap">
    <div class="hero">
      <h1>애니 티어<span>허브</span></h1>
      <p>// 원하는 위젯을 선택하세요</p>
    </div>
    <div class="widget-grid">
      <div class="widget-card" data-target="tier">
        <div class="widget-icon">🏆</div>
        <div class="widget-title">티어표</div>
        <div class="widget-desc">GOD부터 JOAT까지, 애니를 티어별로 분류합니다.</div>
        <div class="widget-arrow">보러가기 →</div>
      </div>
      <div class="widget-card" data-target="scenes">
        <div class="widget-icon">🎬</div>
        <div class="widget-title">애니메이션 명장면</div>
        <div class="widget-desc">기억에 남는 명장면을 모아봅니다.</div>
        <div class="widget-arrow">보러가기 →</div>
      </div>
      <div class="widget-card" data-target="criteria">
        <div class="widget-icon">📋</div>
        <div class="widget-title">티어표 기준표</div>
        <div class="widget-desc">각 티어가 어떤 기준으로 나뉘는지 확인합니다.</div>
        <div class="widget-arrow">보러가기 →</div>
      </div>
      <div class="widget-card" data-target="admin">
        <div class="widget-icon">🔐</div>
        <div class="widget-title">관리자 권한</div>
        <div class="widget-desc">비밀번호 입력 시 티어표 편집이 가능합니다.</div>
        <div class="widget-arrow">보러가기 →</div>
      </div>
    </div>
  </div>
</div>

<!-- TIER LIST -->
<div class="view" id="view-tier">
  <div class="wrap">
    <div id="tierLockNote" class="lock-note" style="display:none;">🔒 현재 보기 전용입니다. 티어를 추가·이동·삭제하려면 관리자 권한 위젯에서 비밀번호를 입력하세요.</div>
    <div class="controls" id="tierControls" style="display:none;">
      <form class="add-form" id="addForm">
        <input type="text" id="addInput" placeholder="애니 제목 입력 후 추가..." maxlength="40">
        <button type="submit">+ 추가</button>
      </form>
      <button class="reset-btn" id="resetBtn" type="button">초기화</button>
    </div>
    <div id="board"></div>
    <div class="bench-section">
      <div class="bench-title">대기중</div>
      <div class="dropzone bench-drop" id="bench" data-tier="bench"></div>
    </div>
  </div>
</div>

<!-- SCENES -->
<div class="view" id="view-scenes">
  <div class="wrap">
    <form class="add-scene-form" id="sceneForm">
      <input type="text" id="sceneAnime" placeholder="애니 제목" maxlength="40" required>
      <textarea id="sceneDesc" placeholder="장면 설명을 적어주세요"></textarea>
      <input type="text" id="sceneYoutube" placeholder="유튜브 링크 (선택사항)">
      <button type="submit" class="login-btn" style="align-self:flex-start;">+ 명장면 추가</button>
    </form>
    <div id="sceneList"></div>
  </div>
</div>

<!-- CRITERIA -->
<div class="view" id="view-criteria">
  <div class="wrap">
    <table class="criteria-table">
      <thead><tr><th>티어</th><th>기준</th></tr></thead>
      <tbody id="criteriaBody"></tbody>
    </table>
  </div>
</div>

<!-- ADMIN -->
<div class="view" id="view-admin">
  <div class="wrap">
    <div class="admin-panel" id="adminPanel"></div>
  </div>
</div>

<div class="modal-overlay" id="descModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="descModalTitle"></div>
      <button class="modal-close" id="descModalClose">×</button>
    </div>
    <div class="modal-body" id="descModalBody"></div>
  </div>
</div>

<footer class="note">데이터는 이 브라우저에 자동 저장됩니다.</footer>

<script>
const TIER_DEFS = [
  {id:'GOD',   label:'GOD',    color:'#FFD700', desc:'각 장르별 1위 + GOAT에서 승급'},
  {id:'GOAT',  label:'GOAT',   color:'#FF9F1C', desc:'추천 애니 + 작화·스토리 모두 좋음'},
  {id:'AURA',  label:'Aura',   color:'#B057F2', desc:'GOAT는 아니지만 1티어보단 좋음'},
  {id:'T0',    label:'0티어',  color:'#3DDC97', desc:'작화는 매우 좋고 스토리는 평타'},
  {id:'T1',    label:'1티어',  color:'#4FB6E8', desc:'작화·스토리가 좋지만 결과 or 원인이 이상함'},
  {id:'T1_5',  label:'1.5티어',color:'#7C9CE0', desc:'작화 or 스토리는 매우 좋지만 나머지 하나가 애매함'},
  {id:'T2',    label:'2티어',  color:'#F2C94C', desc:'작화 or 스토리가 좋지만 나머지 하나가 별로임'},
  {id:'T3',    label:'3티어',  color:'#F2994A', desc:'스토리는 좋지만 작화가 나쁨'},
  {id:'T4',    label:'4티어',  color:'#E2725B', desc:'작화·스토리 둘 다 떨어짐'},
  {id:'T5',    label:'5티어',  color:'#B5484A', desc:'스토리가 매우 망했고 작화도 아쉬움'},
  {id:'T6',    label:'6티어',  color:'#8B5E83', desc:'희귀한 취향을 가진 사람들만 보는 애니'},
  {id:'JOAT',  label:'JOAT',   color:'#4A4A4A', desc:'보지 마셈'},
  {id:'UNSURE',label:'애매함', color:'#B5B0A6', desc:'잘 모름 (판단 보류)'},
];
const ADMIN_PIN = '9039';
const STORAGE_KEY = 'anime-hub-state-v3';

const SEED_DATA = {
  GOD: ["RE:제로부터 시작하는 이세계 생활","4월은 너의 거짓말","마녀의 여행","향기로운 꽃은 늠름하게 핀다","바이올렛 에버가든","패배 히로인이 너무 많아!"],

const EMOJIS = ["⚔️","🔥","🌊","🐉","👹","🎭","🥷","🏐","🔫","🕶️","📖","🎌","💥","🌙","🍜","🎯","🐺","⛩️"];
const GRADIENTS = [
  "linear-gradient(135deg,#ff5c6c,#e6394b)","linear-gradient(135deg,#ff9a3c,#e6394b)",
  "linear-gradient(135deg,#3aa0ff,#1c5faa)","linear-gradient(135deg,#7ec850,#3f8f2a)",

];

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function makeId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let state = { items:{}, assignment:{}, scenes:[] };
let isAdmin = false;

function seedDefaults(){
  state = {items:{}, assignment:{}, scenes:[]};
  Object.entries(SEED_DATA).forEach(([tierId, names])=>{
    names.forEach(name=>{
      const id = makeId();
      state.items[id] = {id, name, desc:''};
      state.assignment[id] = tierId;
    });
  });
}

async function save(){
  const savedState = JSON.stringify(state);
  try{ localStorage.setItem(STORAGE_KEY, savedState); }
  catch(e){ console.error('local save failed', e); }

  try{
    if(window.storage?.set) await window.storage.set(STORAGE_KEY, savedState, false);
  }catch(e){ console.error('remote save failed', e); }
}
async function load(){
  try{
    const savedState = localStorage.getItem(STORAGE_KEY);
    if(savedState){
      const parsed = JSON.parse(savedState);
      if(parsed && parsed.items){ state = {scenes:[], ...parsed}; return; }
    }
  }catch(e){ console.error('local load failed', e); }

  try{
    if(!window.storage?.get) throw new Error('storage unavailable');
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.items){
        state = {scenes:[], ...parsed};
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return;
      }
    }
  }catch(e){ /* not found */ }
  seedDefaults();
  await save();
}

function cardMeta(item){
  const h = hashStr(item.name);
  return { emoji: EMOJIS[h % EMOJIS.length], gradient: GRADIENTS[h % GRADIENTS.length] };
}

/* ---------- TIER BOARD ---------- */
function renderTier(){
  document.getElementById('tierLockNote').style.display = isAdmin ? 'none' : 'block';
  document.getElementById('tierControls').style.display = isAdmin ? 'flex' : 'none';

  const board = document.getElementById('board');
  board.innerHTML = '';
  TIER_DEFS.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'tier-row';
    const badge = document.createElement('div');
    badge.className = 'tier-badge';
    badge.style.setProperty('--tier-color', t.color);
    badge.textContent = t.label;
    const zone = document.createElement('div');
    zone.className = 'dropzone';
    zone.dataset.tier = t.id;
    row.appendChild(badge);
    row.appendChild(zone);
    board.appendChild(row);
  });

  document.querySelectorAll('#board .dropzone').forEach(z=> z.innerHTML='');
  const bench = document.getElementById('bench');
  bench.innerHTML = '';

  Object.values(state.items).forEach(item=>{
    const tier = state.assignment[item.id] || 'bench';
    const zone = tier === 'bench' ? bench : document.querySelector(`#board .dropzone[data-tier="${tier}"]`);
    if(!zone) return;
    zone.appendChild(buildCard(item));
  });
}

function buildCard(item){
  const meta = cardMeta(item);
  const card = document.createElement('div');
  card.className = 'card' + (isAdmin ? ' editable' : '');
  card.dataset.id = item.id;
  card.style.background = meta.gradient;

  const emoji = document.createElement('span'); emoji.className='emoji'; emoji.textContent = meta.emoji;
  const name = document.createElement('span'); name.className='name'; name.textContent = item.name;
  card.appendChild(emoji); card.appendChild(name);

  if(isAdmin){
    const move = document.createElement('select');
    move.className = 'move-select';
    const benchOpt = document.createElement('option');
    benchOpt.value = 'bench'; benchOpt.textContent = '대기중';
    move.appendChild(benchOpt);
    TIER_DEFS.forEach(t=>{
      const opt = document.createElement('option');
      opt.value = t.id; opt.textContent = t.label;
      move.appendChild(opt);
    });
    move.value = state.assignment[item.id] || 'bench';
    move.addEventListener('pointerdown', e=>e.stopPropagation());
    move.addEventListener('click', e=>e.stopPropagation());
    move.addEventListener('change', ()=>{
      state.assignment[item.id] = move.value;
      save(); renderTier();
    });
    card.appendChild(move);

    const del = document.createElement('button');
    del.className='del'; del.type='button'; del.textContent='×';
    del.addEventListener('pointerdown', e=>e.stopPropagation());
    del.addEventListener('click', (e)=>{
      e.stopPropagation();
      delete state.items[item.id];
      delete state.assignment[item.id];
      save(); renderTier();
    });
    card.appendChild(del);
    card.addEventListener('pointerdown', onCardPointerDown);
  }else{
    card.addEventListener('click', ()=> openDescModal(item.id));
  }
  return card;
}

let dragState = null;
function onCardPointerDown(e){
  if(e.target.closest('.del')) return;
  const card = e.currentTarget;
  e.preventDefault();
  const rect = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.style.width = rect.width+'px';
  document.body.appendChild(ghost);
  dragState = { id: card.dataset.id, offsetX: e.clientX-rect.left, offsetY: e.clientY-rect.top, ghost, startX: e.clientX, startY: e.clientY, moved:false };
  card.classList.add('dragging-source');
  moveGhost(e);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
}
function moveGhost(e){
  if(!dragState) return;
  dragState.ghost.style.left = (e.clientX-dragState.offsetX)+'px';
  dragState.ghost.style.top = (e.clientY-dragState.offsetY)+'px';
}
function onPointerMove(e){
  moveGhost(e);
  if(dragState && !dragState.moved){
    const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
    if(Math.hypot(dx,dy) > 6) dragState.moved = true;
  }
  document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('drop-hover'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const zone = el && el.closest('.dropzone');
  if(zone) zone.classList.add('drop-hover');
}
function onPointerUp(e){
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  if(!dragState) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const zone = el && el.closest('.dropzone');
  if(zone && dragState.moved){ state.assignment[dragState.id] = zone.dataset.tier; save(); }
  const wasClick = !dragState.moved;
  const clickedId = dragState.id;
  dragState.ghost.remove();
  document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('drop-hover'));
  dragState = null;
  renderTier();
  if(wasClick) openDescModal(clickedId);
}

function openDescModal(itemId){
  const item = state.items[itemId];
  if(!item) return;
  document.getElementById('descModalTitle').textContent = item.name;
  const descEl = document.getElementById('descModalBody');
  if(item.desc && item.desc.trim()){

  document.getElementById('descModal').classList.add('show');

/* ---------- SCENES ---------- */
function extractYoutubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function renderScenes(){
  const list = document.getElementById('sceneList');
  list.innerHTML = '';
  if(state.scenes.length === 0){
    list.innerHTML = '<div class="lock-note">아직 등록된 명장면이 없습니다. 위 폼으로 추가해보세요!</div>';
    return;
  }
  [...state.scenes].reverse().forEach(sc=>{
    const card = document.createElement('div');
    card.className = 'scene-card';
    const head = document.createElement('div');
    head.className = 'scene-head';
    const title = document.createElement('div');
    title.className = 'scene-title';
    title.textContent = sc.anime;
    head.appendChild(title);
    if(isAdmin){
      const del = document.createElement('button');
      del.className='scene-del'; del.textContent='삭제';
      del.addEventListener('click', ()=>{
        state.scenes = state.scenes.filter(s=>s.id!==sc.id);
        save(); renderScenes();
      });
      head.appendChild(del);
    }
    card.appendChild(head);
    if(sc.desc){
      const desc = document.createElement('div');
      desc.className='scene-desc';
      desc.textContent = sc.desc;
      card.appendChild(desc);
    }
    const vid = extractYoutubeId(sc.youtube);
    if(vid){
      const embed = document.createElement('div');
      embed.className='scene-embed';
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen loading="lazy"></iframe>`;
      card.appendChild(embed);
    }
    list.appendChild(card);
  });
}
document.getElementById('sceneForm').addEventListener('submit', e=>{
  e.preventDefault();
  const anime = document.getElementById('sceneAnime').value.trim();
  const desc = document.getElementById('sceneDesc').value.trim();
  const youtube = document.getElementById('sceneYoutube').value.trim();
  if(!anime) return;
  state.scenes.push({id: makeId(), anime, desc, youtube});
  document.getElementById('sceneAnime').value='';
  document.getElementById('sceneDesc').value='';
  document.getElementById('sceneYoutube').value='';
  save(); renderScenes();
});

    panel.innerHTML = `
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#67615a;">비밀번호를 입력하면 티어표 편집 권한이 활성화됩니다.</div>
      <input type="password" id="pinInput" placeholder="비밀번호 4자리" maxlength="8" inputmode="numeric">
      <button class="login-btn" id="loginBtn">로그인</button>
      <div id="pinMsg"></div>
    `;
    document.getElementById('loginBtn').addEventListener('click', tryLogin);
    document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  }
}
function populateDescManager(){
  const select = document.getElementById('descSelect');
  select.innerHTML = '';
  TIER_DEFS.forEach(t=>{
    const ids = Object.values(state.items).filter(it => (state.assignment[it.id] || 'bench') === t.id);
    if(ids.length === 0) return;
    const group = document.createElement('optgroup');
    group.label = t.label;
    ids.sort((a,b)=> a.name.localeCompare(b.name,'ko')).forEach(it=>{
      const opt = document.createElement('option');
      opt.value = it.id;
      opt.textContent = it.name + (it.desc && it.desc.trim() ? ' ✓' : '');
      group.appendChild(opt);
    });
    select.appendChild(group);
  });
  const benchIds = Object.values(state.items).filter(it => (state.assignment[it.id] || 'bench') === 'bench');
  if(benchIds.length){
    const group = document.createElement('optgroup');
    group.label = '대기중';
    benchIds.sort((a,b)=> a.name.localeCompare(b.name,'ko')).forEach(it=>{
      const opt = document.createElement('option');
      opt.value = it.id;
      opt.textContent = it.name + (it.desc && it.desc.trim() ? ' ✓' : '');
      group.appendChild(opt);
    });
    select.appendChild(group);
  }

  function loadDescIntoTextarea(){
    const item = state.items[select.value];
    document.getElementById('descTextarea').value = (item && item.desc) || '';
    document.getElementById('descSaveMsg').textContent = '';
  }
  select.addEventListener('change', loadDescIntoTextarea);
  loadDescIntoTextarea();

  document.getElementById('descSaveBtn').addEventListener('click', ()=>{
    const item = state.items[select.value];
    if(!item) return;
    item.desc = document.getElementById('descTextarea').value;
    save();
    document.getElementById('descSaveMsg').textContent = '✅ 저장되었습니다.';
    const opt = select.selectedOptions[0];
    if(opt) opt.textContent = item.name + (item.desc && item.desc.trim() ? ' ✓' : '');
  });
}

function tryLogin(){
  const val = document.getElementById('pinInput').value.trim();
  const msg = document.getElementById('pinMsg');
  if(val === ADMIN_PIN){
    isAdmin = true;
    renderAdmin();
  }else{
    msg.innerHTML = '<div class="admin-status err">❌ 비밀번호가 올바르지 않습니다.</div>';
  }
}

/* ---------- INIT ---------- */
(async function init(){
  await load();
})();
</script>
